<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ========================================== -->
    <!-- PRIMARY SEO META TAGS (For Google & Edge)  -->
    <!-- ========================================== -->
    <title>GWC Academy | Live IT Cohorts & Practical Tech Training</title>
    <meta name="title" content="GWC Academy | Live IT Cohorts & Practical Tech Training" />
    <meta name="description" content="Join GWC Academy for live, instructor-led IT courses in Full-Stack Development, Cyber Security, and Cloud. Build production-grade projects and gain internship opportunities with Vaptura Labs." />
    <meta name="keywords" content="live online IT courses, full stack developer live training, cyber security cohorts, python programming, cloud infrastructure, Vaptura labs internship, tech courses India" />
    <meta name="author" content="GWC Academy" />
    
    <!-- Tells search engines to index this site -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1e293b" />

    <!-- ========================================== -->
    <!-- FAVICON ICON                               -->
    <!-- ========================================== -->
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />

    <!-- ========================================== -->
    <!-- OPEN GRAPH / SOCIAL MEDIA PREVIEW TAGS     -->
    <!-- ========================================== -->
    <!-- Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GWC Academy | Live IT Cohorts & Practical Tech Training" />
    <meta property="og:description" content="Join GWC Academy for live, instructor-led IT courses in Full-Stack Development, Cyber Security, and Cloud. Build production-grade projects and gain internship opportunities." />
    <!-- Note: Add an og-image.jpg to your public/images folder for the visual link preview -->
    <meta property="og:image" content="/images/og-image.png" />


    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="GWC Academy | Live IT Cohorts & Practical Tech Training" />
    <meta property="twitter:description" content="Join GWC Academy for live, instructor-led IT courses in Full-Stack Development, Cyber Security, and Cloud." />
    <meta property="twitter:image" content="/images/og-image.png" />
    
    <!-- ========================================== -->
    <!-- GOOGLE FONTS                               -->
    <!-- ========================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- React will inject the entire website into this root div -->
    <div id="root"></div>
    
    <!-- Connects to your main.jsx file -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
